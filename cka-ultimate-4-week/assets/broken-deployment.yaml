apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-web
  namespace: cka-debug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-web
  template:
    metadata:
      labels:
        app: broken-web
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz-does-not-exist
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
