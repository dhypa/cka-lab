apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cka-kustomize-prod
resources:
- ../../base
namePrefix: prod-
replicas:
- name: web
  count: 3
labels:
- pairs:
    environment: prod
patches:
- target:
    kind: Deployment
    name: web
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests: {cpu: 20m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
