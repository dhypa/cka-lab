#cloud-config

package_update: true
package_upgrade: false

packages:
  - containerd
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - vim
  - jq
  - bash-completion

write_files:
  # Load these kernel modules on every boot.
  - path: /etc/modules-load.d/kubernetes.conf
    permissions: "0644"
    content: |
      overlay
      br_netfilter

  # Kubernetes / CNI networking requirements.
  - path: /etc/sysctl.d/99-kubernetes.conf
    permissions: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

runcmd:
  # ---------------------------------------------------------------------------
  # Disable swap
  # ---------------------------------------------------------------------------

  - swapoff -a

  # Comment out any swap entries in /etc/fstab so swap remains disabled
  # after reboot.
  - sed -ri '/\sswap\s/s/^#?/#/' /etc/fstab

  # ---------------------------------------------------------------------------
  # Kernel configuration
  # ---------------------------------------------------------------------------

  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # ---------------------------------------------------------------------------
  # Configure containerd
  # ---------------------------------------------------------------------------

  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml

  # kubeadm defaults kubelet to systemd cgroups, so containerd must match.
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml

  - systemctl restart containerd
  - systemctl enable containerd

  # ---------------------------------------------------------------------------
  # Kubernetes 1.35 repository
  # ---------------------------------------------------------------------------

  - install -m 0755 -d /etc/apt/keyrings

  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /' > /etc/apt/sources.list.d/kubernetes.list

  - apt-get update

  - apt-get install -y kubelet kubeadm kubectl cri-tools

  # Don't accidentally upgrade Kubernetes during apt upgrade.
  - apt-mark hold kubelet kubeadm kubectl

  - systemctl enable kubelet

  # ---------------------------------------------------------------------------
  # Convenience tooling
  # ---------------------------------------------------------------------------

  - echo 'source <(kubectl completion bash)' >> /home/ubuntu/.bashrc
  - echo 'alias k=kubectl' >> /home/ubuntu/.bashrc
  - echo 'complete -o default -F __start_kubectl k' >> /home/ubuntu/.bashrc
